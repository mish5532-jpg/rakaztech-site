<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عالم الأبطال">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>عالم الأبطال — خالد وعبدالرحمن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--k1:#2563eb;--k2:#16a34a;--acc:#2563eb;--acc2:#ff5a36;--sky1:#7dd3fc;--sky2:#e0f2fe}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Baloo Bhaijaan 2","Fredoka",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#7dd3fc,#e0f2fe 60%,#bbf7d0);-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow-x:hidden}
.en,.N,.L.en{font-family:"Fredoka","Baloo Bhaijaan 2",system-ui,sans-serif}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.screen{display:none;min-height:100dvh;padding:14px 18px 18px;flex-direction:column;position:relative}
.screen.on{display:flex;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* clouds */
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;width:140px;height:44px;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:64px;height:64px;top:-30px;right:24px}.cloud::after{width:48px;height:48px;top:-20px;left:22px}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.screen>*{position:relative;z-index:1}
/* characters */
.chr{width:100%;height:auto;overflow:visible;display:block}
.chr .body{transform-origin:50% 90%;transform-box:fill-box;animation:bob 2.2s ease-in-out infinite}
.chr .eyes{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
.happy .chr .body{animation:hop .55s ease 3}
.sad .chr .body{animation:shake .5s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-26px) rotate(-6deg)}70%{transform:translateY(-8px) rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-4deg)}75%{transform:translateX(8px) rotate(4deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:clamp(30px,5vw,52px);font-weight:800;margin:6px 0 0;text-align:center;color:#fff;text-shadow:0 4px 0 #1d4ed8,0 8px 18px rgba(0,0,0,.2);animation:titleBob 3s ease-in-out infinite}
@keyframes titleBob{50%{transform:translateY(-6px) rotate(-1deg)}}
.subtitle{text-align:center;font-size:clamp(17px,2.4vw,24px);font-weight:700;color:#0c4a6e;margin:2px 0 14px}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3vw,32px);flex:1;align-content:center;max-width:1000px;width:100%;margin:0 auto}
.kid{background:#fff;border-radius:34px;padding:18px 16px 20px;box-shadow:0 12px 0 var(--c),0 22px 40px -12px rgba(0,0,0,.3);border:5px solid var(--c);text-align:center;transition:transform .2s;position:relative;overflow:hidden}
.kid:active{transform:translateY(8px) scale(.98);box-shadow:0 4px 0 var(--c)}
.kid::before{content:"";position:absolute;inset:auto -20% -40% -20%;height:55%;background:var(--c);opacity:.12;border-radius:50%}
.kid .av{width:min(78%,260px);margin:0 auto}
.kid h2{margin:6px 0 0;font-size:clamp(30px,4.6vw,48px);color:var(--c);line-height:1.1}
.kid .gr{font-size:clamp(15px,2vw,20px);font-weight:700;opacity:.7}
.chips{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{background:#f1f5f9;border-radius:999px;padding:4px 14px;font-weight:800;font-size:clamp(15px,2vw,20px)}
.gear{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.75);font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
/* world */
.hdr{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.85);border-radius:26px;padding:10px 14px;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.hbtn{width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;font-size:28px;box-shadow:0 5px 0 rgba(0,0,0,.25);flex:none}
.hbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.hname{font-size:clamp(22px,3.4vw,34px);font-weight:800;color:var(--acc);line-height:1}
.stat{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stat .chip{background:#fff7d6;border:2px solid #facc15}
.greet{display:flex;align-items:center;gap:14px;margin:14px 0 6px}
.greet .mini{width:clamp(110px,16vw,170px);flex:none}
.bubble{background:#fff;border-radius:24px;padding:12px 18px;font-size:clamp(19px,2.6vw,27px);font-weight:800;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.08);animation:pop .4s ease}
.bubble::before{content:"";position:absolute;right:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-left-color:#fff}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.goalbar{height:16px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:6px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#f97316);border-radius:99px;transition:width .6s}
.daily{font-size:clamp(14px,1.8vw,17px);font-weight:700;margin-top:6px;opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,22vw,210px),1fr));gap:clamp(12px,2vw,20px);margin-top:12px}
.tile{border-radius:28px;padding:16px 10px 14px;color:#fff;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.22);position:relative;overflow:hidden;transition:transform .15s;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile .ic{font-size:clamp(42px,6vw,60px);line-height:1;font-weight:800;text-shadow:0 4px 0 rgba(0,0,0,.15);animation:bob 2.6s ease-in-out infinite}
.tile b{font-size:clamp(19px,2.6vw,25px);margin-top:6px;line-height:1.15}
.tile small{font-size:clamp(14px,1.7vw,16px);font-weight:700;opacity:.9}
.tile .best{position:absolute;top:8px;left:10px;font-size:15px}
.t-red{background:linear-gradient(160deg,#fb7185,#e11d48)}.t-blue{background:linear-gradient(160deg,#60a5fa,#2563eb)}.t-green{background:linear-gradient(160deg,#4ade80,#16a34a)}.t-gold{background:linear-gradient(160deg,#fbbf24,#ea580c)}.t-purple{background:linear-gradient(160deg,#c084fc,#7c3aed)}.t-teal{background:linear-gradient(160deg,#2dd4bf,#0d9488)}.t-pink{background:linear-gradient(160deg,#f9a8d4,#db2777)}
.sec{font-size:clamp(19px,2.4vw,24px);font-weight:800;margin:18px 4px 0;color:#0c4a6e}
/* game */
.gtop{display:flex;align-items:center;gap:10px}
.gtitle{font-size:clamp(20px,3vw,28px);font-weight:800;flex:1}
.prog{display:flex;gap:6px;align-items:center;font-size:24px}
.scene{margin-top:10px;border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.track{background:#334155;padding:20px 0 8px;position:relative}
.lane{position:relative;height:clamp(56px,8vh,72px);border-bottom:3px dashed rgba(255,255,255,.5)}
.lane:last-child{border-bottom:0}
.lane .nm{position:absolute;right:8px;top:2px;color:#fff;font-weight:800;font-size:13px;opacity:.75}
.car{position:absolute;right:2%;top:50%;transform:translateY(-50%);font-size:clamp(40px,6vh,54px);transition:right .8s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 4px 2px rgba(0,0,0,.35))}
.car.zoom::after{content:"💨";position:absolute;right:-34px;top:8px;font-size:28px;animation:puff .6s ease forwards}
@keyframes puff{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:translateX(20px) scale(1.4)}}
.finish{position:absolute;left:5%;top:0;bottom:0;width:22px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/11px 11px;z-index:0}
.flag{position:absolute;left:1%;top:-4px;font-size:34px}
.pitch{height:clamp(190px,26vh,240px);background:repeating-linear-gradient(90deg,#22c55e 0 60px,#16a34a 60px 120px);position:relative}
.goal{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(70%,420px);height:58%;border:7px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 14px),rgba(0,0,0,.08)}
.keeper{position:absolute;bottom:0;left:50%;width:54px;height:76px;margin-left:-27px;transition:transform .35s cubic-bezier(.3,1.3,.5,1);transform-origin:50% 100%}
.keeper .hd{width:28px;height:28px;border-radius:50%;background:#f1c27d;margin:0 auto;position:relative}
.keeper .hd::after{content:"";position:absolute;top:10px;left:6px;width:16px;height:4px;border-left:4px solid #222;border-right:4px solid #222}
.keeper .bd{width:42px;height:44px;background:#f97316;border-radius:14px 14px 6px 6px;margin:3px auto 0;position:relative}
.keeper .bd::before,.keeper .bd::after{content:"";position:absolute;top:-6px;width:18px;height:18px;border-radius:50%;background:#fde047;border:2px solid #a16207}
.keeper .bd::before{right:-16px}.keeper .bd::after{left:-16px}
.ball{position:absolute;bottom:10px;left:50%;margin-left:-22px;font-size:44px;line-height:1;transition:transform .55s cubic-bezier(.2,.8,.3,1)}
.spot{position:absolute;bottom:4px;left:50%;width:70px;height:10px;margin-left:-35px;border-radius:50%;background:rgba(255,255,255,.5)}
.gooal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(46px,8vw,80px);font-weight:800;color:#fff;text-shadow:0 5px 0 #b45309,0 0 30px #facc15;pointer-events:none;opacity:0}
.gooal.on{animation:gooal 1.3s ease}
@keyframes gooal{0%{opacity:0;transform:scale(.3) rotate(-10deg)}25%{opacity:1;transform:scale(1.15) rotate(3deg)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.qrow{display:flex;align-items:center;gap:14px;margin-top:12px}
.qrow .mini{width:clamp(96px,13vw,140px);flex:none}
.qcard{flex:1;background:#fff;border-radius:28px;padding:12px 16px;box-shadow:0 6px 0 rgba(0,0,0,.08);display:flex;align-items:center;gap:12px;min-height:110px}
.qtext{font-size:clamp(22px,3.2vw,34px);font-weight:800;flex:1;line-height:1.25}
.qtext b{color:var(--acc)}
.say{width:70px;height:70px;border-radius:50%;background:var(--acc);color:#fff;font-size:34px;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.25);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 5px 0 rgba(0,0,0,.25),0 0 0 0 rgba(37,99,235,.45)}70%{box-shadow:0 5px 0 rgba(0,0,0,.25),0 0 0 18px rgba(37,99,235,0)}}
.vis{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;max-width:45%}
.emo{font-size:clamp(64px,10vw,96px);line-height:1;animation:pop .4s ease}
.bigL{font-size:clamp(70px,11vw,110px);font-weight:800;color:var(--acc2);line-height:1}
.word{font-size:clamp(40px,6vw,60px);font-weight:800;letter-spacing:2px}
.blank{display:inline-block;min-width:1em;border-bottom:5px dashed var(--acc2);color:var(--acc2);margin:0 4px}
.cnt{font-size:clamp(30px,4.5vw,44px);line-height:1.1}
.math{font-size:clamp(46px,7vw,72px);font-weight:800;direction:ltr;font-family:"Fredoka",sans-serif;color:var(--acc)}
.opts{display:grid;gap:clamp(10px,2vw,18px);margin-top:14px;grid-template-columns:repeat(var(--n),1fr)}
.opt{background:#fff;border-radius:26px;min-height:clamp(110px,16vh,150px);box-shadow:0 8px 0 #cbd5e1;font-size:clamp(50px,8vw,80px);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,background .2s;line-height:1;border:4px solid transparent}
.opt:active{transform:translateY(6px);box-shadow:0 2px 0 #cbd5e1}
.opt .N{direction:ltr}.opt small{font-size:.38em;opacity:.55;margin-top:4px;font-family:"Baloo Bhaijaan 2"}
.opt.ok{background:#dcfce7;border-color:#22c55e;box-shadow:0 8px 0 #16a34a;animation:okPop .5s ease}
.opt.no{background:#fee2e2;border-color:#ef4444;box-shadow:0 8px 0 #dc2626;animation:shake .45s}
.opt.dim{opacity:.35}
@keyframes okPop{40%{transform:scale(1.12) rotate(-3deg)}}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.ov.on{display:flex;animation:fadeIn .25s}
.card{background:#fff;border-radius:34px;padding:22px 24px 20px;max-width:560px;width:100%;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.15);animation:pop .4s cubic-bezier(.3,1.5,.5,1);max-height:92vh;overflow:auto}
.card h3{font-size:clamp(30px,4.5vw,44px);margin:4px 0;color:var(--acc)}
.card p{font-size:clamp(19px,2.6vw,24px);font-weight:700;margin:6px 0}
.stars3{font-size:clamp(56px,9vw,80px);letter-spacing:6px}
.stars3 span{display:inline-block;animation:starIn .5s cubic-bezier(.3,1.6,.5,1) both}
.stars3 span.off{filter:grayscale(1);opacity:.3}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.btns{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;font-size:clamp(20px,2.8vw,26px);font-weight:800;padding:12px 26px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn.alt{background:#e2e8f0;color:var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.newst{background:#fef9c3;border:3px dashed #facc15;border-radius:22px;padding:10px;margin-top:10px;font-size:clamp(19px,2.6vw,24px);font-weight:800}
.newst .e{font-size:64px;display:block;animation:hop .6s ease 3}
.res-chr{width:150px;margin:0 auto}
/* learn */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(78px,10vw,104px),1fr));gap:12px;margin-top:14px}
.lcell{aspect-ratio:1;background:#fff;border-radius:22px;font-size:clamp(38px,5.5vw,54px);font-weight:800;box-shadow:0 6px 0 #cbd5e1;color:var(--acc);position:relative}
.lcell.seen{background:#fefce8}
.lcell.seen::after{content:"⭐";position:absolute;top:2px;left:4px;font-size:16px}
.lcell:active{transform:translateY(5px);box-shadow:0 1px 0 #cbd5e1}
.lcard .bigL{font-size:clamp(110px,18vw,170px)}
.lcard .emo{font-size:clamp(80px,13vw,120px)}
.lword{font-size:clamp(36px,5.5vw,52px);font-weight:800}
.lword .f{color:var(--acc2)}
/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(84px,11vw,120px),1fr));gap:14px;margin-top:14px}
.st{aspect-ratio:1;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(46px,6.5vw,66px);box-shadow:0 6px 0 #cbd5e1}
.st.lock{background:#e2e8f0;font-size:34px;opacity:.7}
.st.got{animation:pop .4s ease both}
/* confetti */
.cf{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* parent */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fafc;border-radius:18px;padding:10px 14px;margin-top:10px;font-size:20px;font-weight:700}
.tog{width:70px;height:40px;border-radius:99px;background:#cbd5e1;position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tog.on{background:#22c55e}.tog.on::after{right:34px}
.small{font-size:15px;font-weight:600;opacity:.7}
.buddy{position:absolute;bottom:-4px;left:-8%;width:46%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.kid .av{width:min(62%,220px)}
.hface{width:58px;height:58px;border-radius:50%;overflow:hidden;background:#e0f2fe;border:3px solid var(--acc);flex:none}
.hface .chr .body{animation:none}
.pilot{position:absolute;width:34px;height:34px;top:-16px;right:6px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid #fff}
.pilot .chr .body{animation:none}
.shooter{position:absolute;bottom:4px;left:calc(50% + 40px);width:clamp(70px,9vw,96px)}
.res-chr{width:170px}
.crown{position:absolute;top:-34px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:46px;z-index:3;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.kid .crown{top:-8px;font-size:40px}
.topday{position:absolute;top:12px;right:12px;background:#facc15;color:#713f12;font-weight:800;border-radius:99px;padding:3px 12px;font-size:15px;box-shadow:0 3px 0 #ca8a04}
.keeper .hd.kf{width:58px;height:58px;margin-left:-2px;background:none;border-radius:50%;overflow:hidden;margin-bottom:-6px}
.keeper .hd.kf::after{display:none}.keeper .hd.kf .chr .body{animation:none}
.fire{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:70;pointer-events:none;animation:fireIn 1.9s ease forwards}
.fire .ff{width:min(38vw,260px)}.fire b{font-size:clamp(40px,7vw,70px);color:#fff;text-shadow:0 5px 0 #c2410c,0 0 30px #f97316;margin-top:6px}
@keyframes fireIn{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.lvlup{background:linear-gradient(90deg,#a855f7,#6366f1);color:#fff;border-radius:20px;padding:10px;margin-top:10px;font-size:clamp(22px,3vw,28px);font-weight:800;animation:okPop .6s ease}
.cert{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px;border-radius:24px;background:linear-gradient(135deg,#fef9c3,#fde68a);border:4px double #ca8a04;text-align:right}
.cert-face{width:110px;flex:none;position:relative}.cert-face .crown{top:-26px;font-size:38px}
.cert-t{font-size:clamp(20px,2.8vw,26px);font-weight:800;color:#a16207}.cert-n{font-size:clamp(30px,4.5vw,42px);font-weight:800;color:var(--acc)}
/* rakaz badge */
.rkz-wrap{text-align:center;margin:22px 0 4px}
.rkz{display:inline-flex;align-items:center;gap:9px;direction:ltr;text-decoration:none;background:#fff;border:1px solid #dfe6f7;border-radius:999px;padding:8px 16px 8px 14px;box-shadow:0 6px 18px -12px rgba(11,26,58,.45);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;position:relative;overflow:hidden}
.rkz span{font-family:"Fredoka",system-ui,sans-serif;font-size:11.5px;letter-spacing:.4px;color:#5b6785;font-weight:500}
.rkz img{height:17px;width:auto;display:block}
.rkz::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(45,124,255,.18) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s ease}
.rkz:hover{transform:translateY(-2px)}.rkz:hover::after{transform:translateX(120%)}
@media (max-width:640px){.kids{grid-template-columns:1fr}.qrow .mini{display:none}.vis{max-width:55%}}
@media (orientation:landscape) and (max-height:860px){.greet{margin-top:8px}.tile{min-height:130px}}
</style>

function addStars(k,n){const p=prof(k);const before=Math.min(STICKERS.length,Math.floor(p.stars/3));const lv0=lvl(p.stars),ds0=(p.day===today()?p.dayStars:0);p.stars+=n;if(p.day!==today()){p.day=today();p.dayStars=0}p.dayStars+=n;if(p.lastDay!==today()){p.streak=(p.lastDay===yday()?(p.streak||0)+1:1);p.lastDay=today()}EXTRA={lvlup:lvl(p.stars)>lv0?lvl(p.stars):0,champ:ds0<5&&p.dayStars>=5};if(EXTRA.champ)p.champ=(p.champ||0)+1;save();const after=Math.min(STICKERS.length,Math.floor(p.stars/3));return STICKERS.slice(before,after)}

let AC;function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type,vol,f2,delay){const a=ac();if(!a||!S.sfx)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,vol,freq,delay){const a=ac();if(!a||!S.sfx)return;const t=a.currentTime+(delay||0);const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=freq||1000;fl.Q.value=.7;const g=a.createGain();g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol||.2,t+d*.2);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t)}

let CL={},CLready=false,BUF={},curSrc=null,sayTok=0;
['ar','en','num'].forEach(f=>{try{fetch('voice/'+f+'.json').then(r=>r.ok?r.json():{}).then(j=>{Object.assign(CL,j);CLready=true}).catch(()=>{})}catch(e){}});
function b64buf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function getBuf(key){if(BUF[key])return Promise.resolve(BUF[key]);const a=ac();if(!a||!CL[key])return Promise.resolve(null);return new Promise(res=>{try{a.decodeAudioData(b64buf(CL[key]),bf=>{BUF[key]=bf;res(bf)},()=>res(null))}catch(e){res(null)}})}
let voices=[];function lv(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv}
function vFor(l){const pre=l==='ar'?['ar-SA','ar']:['en-US','en-GB','en'];for(const p of pre){const m=voices.filter(v=>v.lang.replace('_','-').startsWith(p));if(m.length)return m.find(v=>/premium|enhanced/i.test(v.name))||m[0]}return null}
function ttsOne(t,l){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(String(t));u.lang=l==='en'?'en-US':'ar-SA';const v=vFor(l);if(v)u.voice=v;u.rate=.9;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,6000)}catch(e){res()}})}
function stopSay(){sayTok++;try{if(curSrc){curSrc.onended=null;curSrc.stop()}}catch(e){}curSrc=null;try{speechSynthesis.cancel()}catch(e){}}
async function say(parts){
 if(!S.voice)return;stopSay();const tok=sayTok;const a=ac();
 for(const [t,l] of parts){
  if(tok!==sayTok)return;const key=(l==='en'?'en':'ar')+'|'+String(t);
  const bf=await getBuf(key);if(tok!==sayTok)return;
  if(bf&&a){await new Promise(res=>{const s=a.createBufferSource();s.buffer=bf;const g=a.createGain();g.gain.value=1.4;s.connect(g);g.connect(a.destination);s.onended=()=>res();curSrc=s;s.start();setTimeout(res,(bf.duration+1)*1000)});await new Promise(r=>setTimeout(r,60))}
  else if('speechSynthesis' in window)await ttsOne(t,l);
 }
}

const rnd=n=>Math.floor(Math.random()*n);const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const ai=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const numH=n=>`<span class="N">${n}</span><small>${ai(n)}</small>`;
let cur={kid:null};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
function theme(k){document.documentElement.style.setProperty('--acc',k.c);document.documentElement.style.setProperty('--acc2',k.c2)}
function confetti(n){const cols=['#f43f5e','#facc15','#22c55e','#3b82f6','#a855f7','#f97316'];for(let i=0;i<(n||70);i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=pick(cols);d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}
function react(el,cls){if(!el)return;el.classList.remove('happy','sad');void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),1700)}
const PRAISE=['برافو يا {n}!','عفية عليك!','كفو يا بطل!','وحش يا {n}!','يا سلام عليك!','الله عليك!','صح لسانك!'];
const ENCOUR=['ولا يهمك!','قربت يا بطل!','عادي، نتعلم سوا!'];
const pn=(a,n)=>pick(a).replace('{n}',n);
/* ---------- question generators ---------- */
function choose(pool,it,n,key){const others=shuffle(pool.filter(x=>key(x)!==key(it))).slice(0,n-1);return shuffle([it,...others])}
function fresh(pool,G,key){let it,t=0;do{it=pick(pool);t++}while(G.recent.includes(key(it))&&t<30);G.recent.push(key(it));if(G.recent.length>8)G.recent.shift();return it}
function genAR(G){
 const g=G.k.grade,n=g===1?3:4;const t=pick(g===1?['find','find','first','first']:['first','pic','missing','find']);
 const it=fresh(AR,G,x=>x[0]);const fix=[[it[2]+'، أولها حرف ال'+it[1],'ar']];
 if(t==='find'){const o=choose(AR,it,n,x=>x[0]);return{prompt:'اسمع 👂 وين الحرف؟',say:[['وينه حرف ال'+it[1]+'؟','ar']],opts:o.map(x=>({h:`<span class="L">${x[0]}</span>`,v:x[0]})),ans:it[0],fix:[['هذا هو حرف ال'+it[1],'ar']]}}
 if(t==='first'){const o=choose(AR,it,n,x=>x[0]);return{prompt:'شنو أول حرف بالكلمة؟',vis:`<div class="emo">${it[3]}</div>`,say:[[it[2],'ar'],['شنو أول حرف فيها؟','ar']],opts:o.map(x=>({h:`<span class="L">${x[0]}</span>`,v:x[0]})),ans:it[0],fix,reveal:it[2]}}
 if(t==='pic'){const o=choose(AR,it,n,x=>x[0]);return{prompt:'أي صورة أولها هالحرف؟',vis:`<div class="bigL">${it[0]}</div>`,say:[['أي صورة أولها حرف ال'+it[1]+'؟','ar']],opts:o.map(x=>({h:`<span>${x[3]}</span>`,v:x[0]})),ans:it[0],fix}}
 const o=choose(AR,it,n,x=>x[0]);const rest=it[2].slice(1);
 return{prompt:'شنو الحرف اللي ناقص؟',vis:`<div class="emo" style="font-size:56px">${it[3]}</div><div class="word"><span class="blank">؟</span>${rest}</div>`,say:[[it[2],'ar'],['شنو الحرف اللي ناقص؟','ar']],opts:o.map(x=>({h:`<span class="L">${x[0]}</span>`,v:x[0]})),ans:it[0],fix}
}
function genEN(G){
 const g=G.k.grade,n=g===1?3:4;const t=pick(g===1?['find','find','first','first']:['first','case','hear','find']);
 if(t==='find'){const it=fresh(EN,G,x=>x[0]);const low=g===2&&Math.random()<.5;const o=choose(EN,it,n,x=>x[0]);const f=x=>low?x[0].toLowerCase():x[0];
  return{prompt:'اسمع 👂 وين الحرف؟',say:[['وينه حرف','ar'],[it[0]+'.','en']],opts:o.map(x=>({h:`<span class="L en">${f(x)}</span>`,v:x[0]})),ans:it[0],fix:[['This is','en'],[it[0]+'.','en']]}}
 const it=fresh(EN_F,G,x=>x[0]);const fix=[[it[1]+' starts with '+it[0]+'.','en']];
 if(t==='first'){const o=choose(EN,it,n,x=>x[0]);return{prompt:'شنو أول حرف بالكلمة؟',vis:`<div class="emo">${it[2]}</div>`,say:[[it[1],'en'],['شنو أول حرف فيها؟','ar']],opts:o.map(x=>({h:`<span class="L en">${g===2?x[0].toLowerCase():x[0]}</span>`,v:x[0]})),ans:it[0],fix,reveal:it[1]}}
 if(t==='case'){const o=choose(EN,it,n,x=>x[0]);return{prompt:'وينه الحرف الصغيّر مال هذا؟',vis:`<div class="bigL en">${it[0]}</div>`,say:[['وينه الحرف الصغيّر مال','ar'],[it[0]+'.','en']],opts:o.map(x=>({h:`<span class="L en">${x[0].toLowerCase()}</span>`,v:x[0]})),ans:it[0],fix:[[it[0]+'. small '+it[0].toLowerCase(),'en']]}}
 const o=choose(EN_F,it,n,x=>x[0]);return{prompt:'اسمع 👂 وين الصورة؟',say:[[it[1],'en']],opts:o.map(x=>({h:`<span>${x[2]}</span>`,v:x[0]})),ans:it[0],fix:[['This is '+it[1],'en']]}
}
function numOpts(ans,n,max){const s=new Set([ans]);let t=0;while(s.size<n&&t<80){t++;const d=ans+(rnd(9)-4);if(d>=0&&d<=max)s.add(d)}let k=0;while(s.size<n)s.add(max+(++k));return shuffle([...s]).map(v=>({h:numH(v),v}))}
function genNUM(G){
 const g=G.k.grade,n=g===1?3:4;
 const t=pick(g===1?['count','count','hear','add','big']:['add','sub','hear','big','seq','add']);
 if(t==='count'){const c=1+rnd(10),e=pick(OBJ);return{prompt:'عِدّ وياي! كم واحد؟',vis:`<div class="cnt">${Array(c).fill(e).join('')}</div>`,say:[['عِدّ وياي! كم واحد تشوف؟','ar']],opts:numOpts(c,n,12),ans:c,fix:[['كلهم','ar'],[c,'ar']]}}
 if(t==='hear'){const m=g===1?20:100,v=g===1?1+rnd(20):11+rnd(89);return{prompt:'اسمع 👂 أي رقم؟',say:[['وينه رقم','ar'],[v,'ar']],opts:numOpts(v,n,m),ans:v,fix:[['هذا رقم','ar'],[v,'ar']]}}
 if(t==='add'){let a,b;if(g===1){a=1+rnd(5);b=1+rnd(5)}else{a=3+rnd(12);b=2+rnd(20-a-1)}const e=pick(OBJ);
  const vis=g===1?`<div><div class="math">${a} + ${b}</div><div class="cnt" style="font-size:30px">${Array(a).fill(e).join('')} ➕ ${Array(b).fill(e).join('')}</div></div>`:`<div class="math">${a} + ${b} = ?</div>`;
  return{prompt:'كم يصير؟',vis,say:[[a,'ar'],['زايد','ar'],[b,'ar'],['كم يصير؟','ar']],opts:numOpts(a+b,n,g===1?12:25),ans:a+b,fix:[[a,'ar'],['زايد','ar'],[b,'ar'],['يصير','ar'],[a+b,'ar']]}}
 if(t==='sub'){const a=6+rnd(15),b=1+rnd(a-1);return{prompt:'كم يبقى؟',vis:`<div class="math">${a} − ${b} = ?</div>`,say:[[a,'ar'],['ناقص','ar'],[b,'ar'],['كم يصير؟','ar']],opts:numOpts(a-b,n,20),ans:a-b,fix:[[a,'ar'],['ناقص','ar'],[b,'ar'],['يصير','ar'],[a-b,'ar']]}}
 if(t==='big'){const m=g===1?20:100;let a=1+rnd(m),b;do{b=1+rnd(m)}while(b===a);const mx=Math.max(a,b);return{prompt:'أي رقم أكبر؟ 🐘',say:[['أي رقم الأكبر؟','ar']],opts:shuffle([a,b]).map(v=>({h:numH(v),v})),ans:mx,fix:[[mx,'ar'],['هو الأكبر','ar']]}}
 const st=pick([1,2,5,10]),s0=st*(rnd(6)+1),seq=[s0,s0+st,s0+2*st],a=s0+3*st;
 return{prompt:'شنو الرقم اللي بعده؟',vis:`<div class="math" style="font-size:44px">${seq.join(' , ')} , ?</div>`,say:[['شنو الرقم اللي بعده؟','ar']],opts:numOpts(a,n,120),ans:a,fix:[['اللي بعده','ar'],[a,'ar']]}
}
const GEN={ar:genAR,en:genEN,num:genNUM,mix:G=>pick([genAR,genEN,genNUM])(G)};

/* ---------- home ---------- */

 const dsOf=k=>{const p=prof(k);return p.day===today()?p.dayStars:0};const dA=dsOf('khalid'),dB=dsOf('abd');const top=dA>dB?'khalid':dB>dA?'abd':null;

 document.documentElement.style.setProperty('--acc','#2563eb');show('home');
}

 </div>`;
 show('world');setTimeout(()=>say([[p.dayStars>=5?`خلصت هدف اليوم! إنت بطل يا ${k.nick}`:`هلا والله ب${k.nick}! أنا ${k.buddy}، شنو نلعب اليوم؟`,'ar']]),250);react($('#wchr'),'happy');

/* ---------- game engine ---------- */
let G=null;
function startGame(id){
 ac();SFX.whistle();const k=KIDS[cur.kid],B=KIDS[k.bro],gm=GAMES.find(g=>g.id===id);
 G={id:Date.now(),gm,k,B,streak:0,warned:false,near:false,recent:[],ok:0,bad:0,qn:0,rival:0,shots:[],goal:gm.mode==='race'?8:(id==='mix'?7:5),busy:false};
 const scene=gm.mode==='race'
  ?`<div class="track"><div class="flag">🏁</div><div class="finish"></div><div class="lane"><span class="nm">${k.name}</span><span class="car" id="me">🏎️<span class="pilot">${k.face()}</span></span></div><div class="lane"><span class="nm">${B.name}</span><span class="car" id="rv">🚙<span class="pilot">${B.face()}</span></span></div></div>`
  :`<div class="pitch"><div class="goal"><div class="keeper" id="kp"><div class="hd kf">${B.face()}</div><div class="bd"></div></div></div><div class="spot"></div><div class="shooter">${k.face()}</div><div class="ball" id="bl">⚽</div><div class="gooal" id="gl">قوووول!</div></div>`;
 $('#game').innerHTML=`<div class="gtop"><button class="hbtn" onclick="quitGame()">✕</button><div class="gtitle ${id==='en'?'en':''}">${gm.title}</div><div class="prog" id="prog"></div></div>
 <div class="scene">${scene}</div>
 <div class="qrow"><div class="mini" id="gchr">${k.face()}</div><div class="qcard"><div style="flex:1"><div class="qtext" id="qt"></div></div><div class="vis" id="qv"></div><button class="say" onclick="sayQ()">🔊</button></div></div>
 <div class="opts" id="opts"></div>`;
 show('game');updProg();setTimeout(nextQ,500);
}
function updProg(){const el=$('#prog');if(!el)return;if(G.gm.mode==='race')el.innerHTML=`<span class="chip">✅ ${G.ok} / ${G.goal}</span>`;else el.innerHTML=Array.from({length:G.goal},(_,i)=>G.shots[i]===undefined?'⚪':G.shots[i]?'⚽':'❌').join('')}
function nextQ(){
 if(!G)return;
 if(G.gm.mode==='race'&&(G.ok>=G.goal||G.rival>=G.goal))return finish();
 if(G.gm.mode==='pen'&&G.shots.length>=G.goal)return finish();
 G.qn++;G.q=GEN[G.gm.gen](G);G.busy=false;const q=G.q;
 $('#qt').innerHTML=q.prompt;$('#qv').innerHTML=q.vis||'';
 const o=$('#opts');o.style.setProperty('--n',q.opts.length);
 o.innerHTML=q.opts.map((x,i)=>`<button class="opt" onclick="answer(${i},this)">${x.h}</button>`).join('');
 sayQ();
}
function sayQ(){if(G&&G.q)say(G.q.say)}
function answer(i,btn){
 if(!G||G.busy)return;G.busy=true;const q=G.q,ok=q.opts[i].v===q.ans,gid=G.id;
 const btns=[...document.querySelectorAll('.opt')];
 if(q.reveal)$('#qv').insertAdjacentHTML('beforeend',`<div class="word" style="font-size:34px;width:100%;text-align:center">${q.reveal}</div>`);
 const N=G.k.nick,BN=G.B.nick,race=G.gm.mode==='race';
 if(ok){btn.classList.add('ok');btns.forEach(b=>b!==btn&&b.classList.add('dim'));SFX.ding();G.ok++;G.streak++;react($('#gchr'),'happy');
  let line=pn(PRAISE,N);
  if(G.streak===3||G.streak===6){line=`${N} على نار!`;fire(`🔥 ${N} على نار!`)}
  else if(race&&!G.near&&G.ok===G.goal-2){G.near=true;line=`كمل يا ${N}، باقي شوي!`}
  else if(!race&&Math.random()<.6)line=`قوووول يا ${N}!`;
  say([[line,'ar']])}
 else{btn.classList.add('no');btns[q.opts.findIndex(x=>x.v===q.ans)].classList.add('ok');SFX.oops();G.bad++;G.streak=0;react($('#gchr'),'sad');
  let first=[pick(ENCOUR),'ar'];
  if(!race)first=[`${BN} صد الكورة!`,'ar'];
  else if(!G.warned&&G.rival+1.5>G.ok){G.warned=true;first=[`يالله يا ${N}! ${BN} قاعد يسبقك!`,'ar']}
  say([first,...q.fix])}
 if(G.gm.mode==='race'){
  const rate=G.k.grade===1?.4:.5;G.rival+=rate+(ok?0:1);
  const me=$('#me'),rv=$('#rv');const pos=v=>(2+Math.min(v,G.goal)/G.goal*84)+'%';
  setTimeout(()=>{if(!G||G.id!==gid)return;if(ok){me.classList.remove('zoom');void me.offsetWidth;me.classList.add('zoom');SFX.vroom()}me.style.right=pos(G.ok);rv.style.right=pos(G.rival)},250);
 }else{shoot(ok,gid);G.shots.push(ok)}
 updProg();
 setTimeout(()=>{if(G&&G.id===gid)nextQ()},ok?1700:2800);
}
function shoot(ok,gid){
 const bl=$('#bl'),kp=$('#kp'),gl=$('#gl');const side=Math.random()<.5?-1:1;const gw=$('.goal').offsetWidth;const dx=side*gw*.32;
 setTimeout(()=>{if(!G||G.id!==gid)return;SFX.kick();
  if(ok){bl.style.transform=`translate(${dx}px,-${$('.pitch').offsetHeight*.62}px) scale(.6) rotate(720deg)`;kp.style.transform=`translateX(${-side*gw*.28}px) rotate(${-side*70}deg)`;
   setTimeout(()=>{SFX.cheer();gl.classList.remove('on');void gl.offsetWidth;gl.classList.add('on');confetti(35)},450)}
  else{kp.style.transform=`translateX(${side*gw*.22}px) rotate(${side*55}deg)`;bl.style.transform=`translate(${side*gw*.2}px,-${$('.pitch').offsetHeight*.42}px) scale(.75)`;setTimeout(()=>{SFX.save();bl.style.transform=`translate(${side*gw*.05}px,-20px) scale(.9)`},450)}
  setTimeout(()=>{if(!G||G.id!==gid)return;bl.style.transition='none';bl.style.transform='';kp.style.transform='';void bl.offsetWidth;bl.style.transition=''},ok?1500:2500);
 },200);
}
function finish(){
 const g=G,k=g.k,p=prof(k.key);let stars,won=true,title,msg;
 if(g.gm.mode==='race'){won=g.ok>=g.goal;stars=won?(g.bad<=1?3:2):1;title=won?`فزت على ${g.B.nick}! 🏆`:`${g.B.nick} فاز هالمرة، الجاية لك!`;msg=won?`${k.buddy} يقول: سواقتك نار يا ${k.nick}!`:'كل مرة تصير أقوى! يالله جرب مرة ثانية'}
 else{const goals=g.shots.filter(Boolean).length;stars=goals===g.goal?3:goals>=Math.ceil(g.goal*.6)?2:1;title=`جبت ${goals} أقوال! ⚽`;msg=stars===3?'يا سلام! إنت هداف البطولة 🥇':stars===2?`حلو يا ${k.nick}! باقي لك شوي وتجيبهم كلهم`:'كل مرة تصير أقوى! يالله جرب مرة ثانية'}
 p.games++;p.best[g.gm.id]=Math.max(p.best[g.gm.id]||0,stars);const news=addStars(k.key,stars);const X=EXTRA;
 G=null;SFX.fanfare();if(stars>=2)confetti();
 $('#ovc').innerHTML=`<div class="res-chr happy" style="position:relative">${k.face()}<div class="buddy" style="width:42%">${k.svg()}</div></div><h3>${title}</h3><div class="stars3">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}" style="animation-delay:${.2+i*.25}s">⭐</span>`).join('')}</div><p>${msg}</p>
 ${news.length?`<div class="newst">🎁 ملصق جديد! <span class="e">${news.join(' ')}</span></div>`:`<p class="small">باقي ${3-(p.stars%3)} ⭐ للملصق الجاي</p>`}
 ${X.lvlup?`<div class="lvlup">🎉 طلعت مستوى ${X.lvlup}!</div>`:''}
 ${X.champ?`<div class="cert"><div class="cert-face"><div class="crown">👑</div>${k.face()}</div><div><div class="cert-t">شهادة بطل اليوم</div><div class="cert-n">${k.name}</div><div class="small">${new Date().toLocaleDateString('ar-KW',{weekday:'long',day:'numeric',month:'long'})} • ⭐ ${p.dayStars}</div></div></div>`:''}
 <div class="btns"><button class="btn" onclick="closeOv();startGame('${g.gm.id}')">🔁 مرة ثانية</button><button class="btn alt" onclick="closeOv();openWorld('${k.key}')">🏠 رجوع</button></div>`;
 $('#ov').classList.add('on');
 setTimeout(()=>say([[title.replace(/[🏆⚽]/g,'').trim(),'ar'],[msg.replace(/[🥇💪]/g,'').trim(),'ar'],...(news.length?[['مبروك! طلع لك ملصق جديد','ar']]:[]),...(X.lvlup?[[`يا سلام! ${k.nick} طلع مستوى جديد!`,'ar']]:[]),...(X.champ?[[`مبروك يا ${k.nick}! صرت بطل اليوم`,'ar']]:[])]),300);
}
function fire(t){const d=document.createElement('div');d.className='fire';d.innerHTML=`<div class="ff">${G.k.face()}</div><b>${t}</b>`;document.body.appendChild(d);confetti(40);setTimeout(()=>d.remove(),1900)}
function quitGame(){G=null;stopSay();SFX.tap();openWorld(cur.kid)}

/* ---------- learn ---------- */
let L=null;
function learnItems(t){const g=KIDS[cur.kid].grade;if(t==='ar')return AR.map(x=>({l:x[0],x}));if(t==='en')return EN.map(x=>({l:x[0],x}));const a=[];for(let i=1;i<=20;i++)a.push({l:i,x:i});if(g===2)for(let i=30;i<=100;i+=10)a.push({l:i,x:i});return a}
function openLearn(t){
 ac();SFX.tap();const k=KIDS[cur.kid];L={t,seen:new Set(),done:false};const items=learnItems(t);
 const ttl={ar:'الحروف العربية',en:'Learn ABC',num:'الأرقام'}[t];
 $('#learn').innerHTML=`<div class="hdr"><button class="hbtn" onclick="SFX.tap();openWorld(cur.kid)">↩︎</button><div class="hname ${t==='en'?'en':''}">${ttl}</div><div class="stat"><span class="chip" id="lc">0 / ${items.length}</span></div></div>
 <div class="greet"><div class="mini" id="lchr" style="width:110px">${k.svg()}</div><div class="bubble">دوس على كل ${t==='num'?'رقم':'حرف'} واسمعه، وإذا خلصتهم كلهم تاخذ ⭐</div></div>
 <div class="lgrid">${items.map((it,i)=>`<button class="lcell ${t==='en'?'en':''}" onclick="learnTap(${i},this)">${t==='num'?`<span class="N">${it.l}</span>`:it.l}</button>`).join('')}</div>`;
 show('learn');say([['دوس على كل '+(t==='num'?'رقم':'حرف')+' واسمعه','ar']]);
}
function learnTap(i,el){
 const items=learnItems(L.t),it=items[i];SFX.pop();el.classList.add('seen');L.seen.add(i);$('#lc').textContent=L.seen.size+' / '+items.length;let h,s;
 if(L.t==='ar'){const x=it.x;h=`<div class="bigL">${x[0]}</div><div class="emo">${x[3]}</div><div class="lword"><span class="f">${x[2][0]}&zwj;</span>&zwj;${x[2].slice(1)}</div>`;s=[['حرف ال'+x[1],'ar'],[x[2],'ar']]}
 else if(L.t==='en'){const x=it.x;const w=x[1];h=`<div class="bigL en">${x[0]} <span style="opacity:.6">${x[0].toLowerCase()}</span></div><div class="emo">${x[2]}</div><div class="lword en">${x[0]==='X'?w.slice(0,2)+'<span class="f">x</span>':`<span class="f">${w[0]}</span>${w.slice(1)}`}</div>`;s=[[x[0]+'.','en'],[x[0]==='X'?'fox. X is at the end.':x[0]+' is for '+w,'en']]}
 else{const n=it.x;const vis=n<=20?`<div class="cnt" style="max-width:420px;margin:0 auto">${Array(n).fill(pick(OBJ)).join('')}</div>`:`<div class="cnt">${Array(n/10).fill('🔟').join(' ')}</div>`;h=`<div class="bigL en">${n}</div><div class="lword">${ai(n)}</div>${vis}`;s=[[n,'ar'],[n,'en']]}
 $('#ovc').innerHTML=`<div class="lcard">${h}</div><div class="btns"><button class="btn" onclick="say(window._ls)">🔊 مرة ثانية</button><button class="btn alt" onclick="closeOv();learnDone()">✔️ تم</button></div>`;
 window._ls=s;$('#ov').classList.add('on');say(s);
}
function learnDone(){const items=learnItems(L.t);if(!L.done&&L.seen.size>=items.length){L.done=true;const news=addStars(cur.kid,1);SFX.fanfare();confetti();react($('#lchr'),'happy');say([['واو! خلصتهم كلهم! هاك نجمة','ar']]);if(news.length)setTimeout(()=>{$('#ovc').innerHTML=`<div class="newst">🎁 ملصق جديد! <span class="e">${news.join(' ')}</span></div><div class="btns"><button class="btn" onclick="closeOv()">يا سلام!</button></div>`;$('#ov').classList.add('on')},1200)}}

/* ---------- stickers ---------- */
function openStickers(){
 SFX.tap();const k=KIDS[cur.kid],p=prof(k.key),got=Math.min(STICKERS.length,Math.floor(p.stars/3));
 $('#stickers').innerHTML=`<div class="hdr"><button class="hbtn" onclick="SFX.tap();openWorld(cur.kid)">↩︎</button><div class="hname">ملصقات ${k.name}</div><div class="stat"><span class="chip">🎁 ${got} / ${STICKERS.length}</span></div></div>
 <div class="greet"><div class="mini" style="width:110px">${k.svg()}</div><div class="bubble">${got<STICKERS.length?`كل 3 نجوم = ملصق جديد! باقي ${3-(p.stars%3)} ⭐`:'جمعت كل الملصقات! أسطورة 👑'}</div></div>
 <div class="sgrid">${STICKERS.map((s,i)=>i<got?`<div class="st got" style="animation-delay:${i*.04}s" onclick="SFX.pop()">${s}</div>`:`<div class="st lock">🔒</div>`).join('')}</div>`;
 show('stickers');
}
